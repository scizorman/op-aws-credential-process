# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: 'CI'

on:
  pull_request:
  # TODO: Remove once the project stabilizes.
  push:
    branches:
      - 'main'

permissions: {}

concurrency:
  # TODO: Simplify to github.head_ref once push trigger is removed.
  group: '${{ github.workflow }}-${{ github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  go:
    runs-on: 'ubuntu-24.04'
    permissions:
      contents: 'read'
    timeout-minutes: 5
    steps:
      - uses: 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0' # v7
        with:
          persist-credentials: false
      - uses: 'cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f' # v31
      - run: |
          nix develop --command make ci
  nix:
    runs-on: '${{ matrix.os }}'
    permissions:
      contents: 'read'
    strategy:
      fail-fast: true
      matrix:
        os:
          - 'ubuntu-24.04'
          - 'ubuntu-24.04-arm'
          - 'macos-latest'
    timeout-minutes: 10
    steps:
      - uses: 'actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0' # v7
        with:
          persist-credentials: false
      - uses: 'cachix/install-nix-action@ab739621df7a23f52766f9ccc97f38da6b7af14f' # v31
      - run: |
          make derivation
